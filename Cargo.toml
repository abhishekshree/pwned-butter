[package]
name = "fda-mumbai-tracker"
version = "0.1.0"
edition = "2024"
rust-version = "1.100"
description = "A Rust ETL that tracks Maharashtra FDA food-safety actions and stores them in Neon for a Next.js dashboard."
license = "MIT"

[lib]
name = "fda_mumbai_tracker"
path = "src/lib.rs"

[[bin]]
name = "local_scrape"
path = "src/bin/local_scrape.rs"

[[bin]]
name = "migrate"
path = "src/bin/migrate.rs"

[dependencies]
tokio = { version = "1", features = ["rt-multi-thread", "macros", "sync", "time"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
strum = { version = "0.28", features = ["derive"] }
anyhow = "1"
async-trait = "0.1"
thiserror = "2"
chrono = { version = "0.4", features = ["serde"] }
reqwest = { version = "0.13", default-features = false, features = ["json", "rustls"] }
genai = "0.7"
rss = "2"
scraper = "0.29"
sqlx = { version = "0.9", default-features = false, features = ["runtime-tokio", "tls-rustls", "postgres", "json", "chrono", "migrate", "macros"] }
urlencoding = "2"
dotenvy = "0.15"
tracing = "0.1.44"
tracing-subscriber = { version = "0.3.23", features = ["env-filter", "fmt"] }
toml = "1.2.1"

[lints.rust]
unused_qualifications = "warn"

[profile.release]
opt-level = 3
lto = "fat"
codegen-units = 1
panic = "abort"
strip = true

[dev-dependencies]
test-case = "3.4.1"
