[package]
name = "fda-mumbai-tracker"
version = "0.1.0"
edition = "2021"
description = "A Rust ETL that tracks Maharashtra FDA food-safety actions and stores them in Neon for a Next.js dashboard."
license = "MIT"

[lib]
name = "fda_mumbai_tracker"
path = "src/lib.rs"

[[bin]]
name = "local_scrape"
path = "src/bin/local_scrape.rs"

[[bin]]
name = "migrate"
path = "src/bin/migrate.rs"

[[bin]]
name = "backfill"
path = "src/bin/backfill.rs"

[dependencies]
tokio = { version = "1", features = ["rt-multi-thread", "macros", "sync", "time"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
anyhow = "1"
chrono = { version = "0.4", features = ["serde"] }
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls"] }
rss = "2"
scraper = "0.22"
sqlx = { version = "0.8", default-features = false, features = ["runtime-tokio", "tls-rustls", "postgres", "json", "chrono", "migrate", "macros"] }
urlencoding = "2"
dotenvy = "0.15"

[profile.release]
opt-level = 3
lto = "fat"
codegen-units = 1
panic = "abort"
strip = true